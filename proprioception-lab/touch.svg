<svg font-family="Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="touchDrawTitle touchDrawDesc"><title id="touchDrawTitle">Tactile identification sequence</title><desc id="touchDrawDesc">Feel the object at two chosen body locations, then explore by hand. Use tactile information only.</desc><defs><marker id="touchDrawArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#665187" stroke-width="1.5"/></marker></defs><g fill="none" stroke="#353343" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><circle cx="160" cy="50" r="27"/><path d="M160 77V195 M105 105H215 M105 105V175 M215 105V175"/><path d="M137 49H183" stroke="#665187" stroke-width="13"/><circle cx="215" cy="145" r="12" stroke="#665187" stroke-dasharray="3 7"/><path d="M280 140H335" stroke="#665187" stroke-width="3" marker-end="url(#touchDrawArrow)"/><path d="M465 115L485 85L515 105L530 85L555 105L570 90L585 115L570 155H480Z"/><rect x="505" y="112" width="37" height="33" rx="4" stroke="#665187"/><g fill="#353343" stroke="none" font-size="17"><text x="46" y="230">Two agreed-upon body locations</text><text x="414" y="185">Then explore with hands</text><text x="425" y="215">Keep vision blocked</text></g></g></svg>