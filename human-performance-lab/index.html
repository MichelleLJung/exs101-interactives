function makePDF(){const pages=[];let commands=[],y=70;const PW=612,PH=792,M=48;
const ascii=s=>String(s).replace(/₂/g,'2').replace(/₁/g,'1').replace(/[–—−]/g,'-').replace(/≥/g,'>=').replace(/≤/g,'<=').replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/→/g,' -> ').replace(/•/g,' | ');

function rawText(s,x,top,size=10,bold=false){s=ascii(s);if(/[^\x20-\x7e]/.test(s)){rasterText(s,x,top,size,bold);return}commands.push(`BT /${bold?'F2':'F1'} ${size} Tf ${x.toFixed(2)} ${(PH-top).toFixed(2)} Td (${pdfEsc(s)}) Tj ET`)}

function endPage(){pages.push(commands.join('\n'));commands=[];y=70}function ensure(h){if(y+h>720)endPage()}
const ctx=document.createElement('canvas').getContext('2d');function measure(s,size){return /^[\x20-\x7e]*$/.test(s)?[...s].reduce((sum,c)=>sum+PDF_FONTS[0].widths[c.charCodeAt(0)-32],0)*size/1000:ctx.measureText(s).width}function wrap(s,size=11,width=516){ctx.font=`${size*1.04}px Arial`;const out=[];ascii(s).split('\n').forEach(p=>{let line='';for(const word of p.split(/\s+/)){if(measure(line+(line?' ':'')+word,size)>width){if(line)out.push(line);line='';if(measure(word,size)>width){let part='';for(const c of word){if(measure(part+c,size)>width){out.push(part);part=''}part+=c}line=part;continue}}line+=(line?' ':'')+word}out.push(line)});return out}

function tablePDF(headers,rows){const widths=headers.map((_,i)=>i===0?110:(516-110)/(headers.length-1));const draw=(row,bold=false)=>{const cells=row.map((c,i)=>wrap(String(c),8,widths[i]-8)),height=Math.max(...cells.map(c=>c.length))*12+12;ensure(height+2);let x=M;cells.forEach((lines,i)=>{commands.push(`0.72 0.78 0.83 RG 0.5 w ${x} ${PH-y-height} ${widths[i]} ${height} re S`);lines.forEach((line,j)=>rawText(line,x+4,y+12+j*12,8,bold));x+=widths[i]});y+=height};draw(headers,true);for(const row of rows){if(y+50>720){endPage();draw(headers,true)}draw(row)}y+=10}

rawText('EXS101 Human Performance Laboratory Report',M,y,17,true);y+=30;textBlock(`Student: ${lab().meta.student} | Date: ${lab().meta.date} | Lab group: ${lab().meta.group}`);textBlock(title(),13,true);
for(const s of reportSections()){heading(s.heading);s.lines.forEach(x=>textBlock(x));if(s.heading==='Results Snapshot'){if(isVO()){ensure(145);heading('Recorded Treadmill Observations');textBlock('Duration = actual stage minutes. RPE = 6-20 scale. Blank measurements = not recorded.',9);tablePDF(['Stage','Min','mph','Grade %','RPE','HR bpm','VO2*',...(cos()?['RER']:[])],observedRows().map(r=>[r.name.replace('Transition Warm-Up','Transition'),r.duration,r.speed,r.grade,val(r.rpe),val(r.hr),val(r.vo2),...(cos()?[val(r.rer)]:[])]));textBlock('* VO2 units: mL/kg/min. Not recorded = unavailable measurement.',9)}else if(lab().points.length){heading('Recorded Power-Time Observations');lab().points.filter(p=>num(p.time)!==null&&num(p.power)!==null).sort((a,b)=>num(a.time)-num(b.time)).forEach(p=>textBlock(`${p.time} s: ${p.power} W`,10))}
for(const s of series()){if(!s.points.length)continue;ensure(275);heading(s.title);const base=y,g=geometry(s),tx=x=>M+(x-30),ty=t=>PH-(base+t-30);commands.push('0.8 0.85 0.89 RG 0.7 w');for(let i=0;i<5;i++){const v=g.ymax*i/4;commands.push(`${tx(60)} ${ty(g.y(v))} m ${tx(490)} ${ty(g.y(v))} l S`);rawText(String(Number(v.toFixed(1))),M,base+g.y(v)-27,9)}commands.push('0.2 0.3 0.4 RG 1 w');commands.push(`${tx(60)} ${ty(60)} m ${tx(60)} ${ty(215)} l ${tx(490)} ${ty(215)} l S`);rawText(s.unit,tx(60),base-8,10);commands.push('0 0.37 0.56 RG 2 w');s.points.forEach((p,i)=>{if(i){const prev=s.points[i-1];commands.push(`${tx(g.x(prev.x))} ${ty(g.y(prev.y))} m ${tx(g.x(p.x))} ${ty(g.y(p.y))} l S`)}commands.push(`${tx(g.x(p.x))-2} ${ty(g.y(p.y))-2} 4 4 re f`);rawText(p.label,tx(g.x(p.x))-4,base+205,9)});if(!isVO()&&s.mean!==null){commands.push(`0.5 0.3 0 RG [4 3] 0 d ${tx(60)} ${ty(g.y(s.mean))} m ${tx(490)} ${ty(g.y(s.mean))} l S [] 0 d`);rawText('Lode mean: '+s.mean+' W',tx(65),base+g.y(s.mean)-35,9)}rawText(s.xlabel,tx(150),base+230,10);y=base+244;commands.push('0.12 0.16 0.22 rg');textBlock('Recorded observations only; connecting lines do not estimate missing values.',9);if(!isVO())textBlock('Reported Lode peak: '+val(s.peak)+' W. Sampled points may not capture this peak.',9)}
}}
textBlock('This report was assembled from data and responses entered by the student using the EXS101 Human Performance Lab tool.',9);if(commands.length)endPage();

const objects=['','<< /Type /Catalog /Pages 2 0 R >>','', '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>'];PDF_FONTS.forEach((f,i)=>{const descriptor=objects.length,stream=descriptor+1;objects[3+i]=`<< /Type /Font /Subtype /TrueType /BaseFont /${f.name} /FirstChar 32 /LastChar 126 /Widths [${f.widths.join(' ')}] /Encoding /WinAnsiEncoding /FontDescriptor ${descriptor} 0 R >>`;objects.push(`<< /Type /FontDescriptor /FontName /${f.name} /Flags 32 /FontBBox [${f.bbox.join(' ')}] /ItalicAngle 0 /Ascent ${f.ascent} /Descent ${f.descent} /CapHeight 730 /StemV ${i?120:80} /FontFile2 ${stream} 0 R >>`);objects.push(`<< /Filter /ASCIIHexDecode /Length ${f.hex.length} /Length1 ${f.length} >>\nstream\n${f.hex}\nendstream`)});const imageIds=images.map(im=>{objects.push(`<< /Type /XObject /Subtype /Image /Width ${im.width} /Height ${im.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /ASCIIHexDecode /Length ${im.data.length} >>\nstream\n${im.data}\nendstream`);return objects.length-1});const kids=[];
pages.forEach((content,i)=>{const pageId=objects.length;objects.push('');const streamId=objects.length;const footer=`BT /F1 8 Tf 48 32 Td (${pdfEsc(ascii(lab().meta.student).replace(/[^\x20-\x7e]/g,'?'))} | ${isVO()?'VO2max':'Wingate'} | ${lab().meta.date} | Page ${i+1} of ${pages.length}) Tj ET`;content+='\n'+footer;objects.push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);objects[pageId]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> /XObject << ${imageIds.map((id,j)=>'/Im'+(j+1)+' '+id+' 0 R').join(' ')} >> >> /Contents ${streamId} 0 R >>`;kids.push(pageId+' 0 R')});objects[2]=`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${kids.length} >>`;let output='%PDF-1.4\n',offsets=[0];objects.slice(1).forEach((o,i)=>{offsets.push(output.length);output+=`${i+1} 0 obj\n${o}\nendobj\n`});const start=output.length;output+=`xref\n0 ${objects.length}\n0000000000 65535 f \n`+offsets.slice(1).map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objects.length} /Root 1 0 R >>\nstartxref\n${start}\n%%EOF`;return new Blob([output],{type:'application/pdf'})}
function build(){const b=missing();errors(b);if(b.length)return;try{const blob=makePDF(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`EXS101-${state.type}-${lab().meta.date}-Lab-Report.pdf`;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);$('#save-status').textContent='PDF downloaded. Review your report, then submit it to Canvas.'}catch(e){errors(['The PDF could not be created. Your entered work is still available in this tab.'])}}
